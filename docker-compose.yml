# Окружение курса «Аналитик данных».
# Поднять:  docker compose up -d
# Погасить: docker compose down          (данные сохраняются)
# Снести:   docker compose down -v       (данные удаляются)

services:
  postgres:
    image: postgres:17-alpine
    container_name: da_postgres
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: casino
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"          # 5433 снаружи, чтобы не спорить с локальным PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db
      - .:/course
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d casino"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: da_clickhouse
    environment:
      CLICKHOUSE_USER: analyst
      CLICKHOUSE_PASSWORD: analyst
      CLICKHOUSE_DB: course
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: UTC
    ports:
      - "8123:8123"          # HTTP, сюда ходят драйверы и curl
      - "9000:9000"          # нативный протокол
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
      - .:/course
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["module6"]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: da_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: analyst
      MINIO_ROOT_PASSWORD: analyst123
      TZ: UTC
    ports:
      - "9002:9000"          # S3 API (9000 занят нативным портом ClickHouse)
      - "9001:9001"          # веб-консоль
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["module6"]

  spark:
    image: apache/spark:3.5.3
    container_name: da_spark
    user: root
    entrypoint: ["/bin/bash", "-lc", "sleep infinity"]
    environment:
      TZ: UTC
      # HOME на томе, чтобы кэш ivy пережил перезапуск: иначе jar-ы
      # hadoop-aws (275 МБ) качаются заново при каждом spark-submit
      HOME: /opt/spark/user-jars
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      PYTHONPATH: /opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
      AWS_REGION: us-east-1
    volumes:
      - .:/course
      - sparkjars:/opt/spark/user-jars
    working_dir: /course
    depends_on:
      - minio
    profiles: ["module6"]

  airflow:
    image: apache/airflow:2.10.2-python3.12
    container_name: da_airflow
    command: standalone
    environment:
      TZ: UTC
      # SQLite + SequentialExecutor: самый лёгкий режим. Для учебного
      # пайплайна достаточно, для прода — нет (задачи идут по одной).
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      _AIRFLOW_WWW_USER_USERNAME: analyst
      _AIRFLOW_WWW_USER_PASSWORD: analyst
    ports:
      - "8080:8080"
    volumes:
      - ./sprint-19-airflow/project/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - .:/course
    profiles: ["module6"]

volumes:
  pgdata:
  chdata:
  miniodata:
  sparkjars:
